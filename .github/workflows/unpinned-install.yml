name: Unpinned install

# What `pip install kittenml` (the README command, no version) gives users on
# the platforms where kittenml 0.9.x cannot install.

on:
  workflow_dispatch:
  push:
    branches: [qa/python-platform-matrix]
    paths: [.github/workflows/unpinned-install.yml]

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, python: "3.12"}
          - {os: windows-11-arm, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.15"}
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-24.04, python: "3.12"}   # control: a supported platform
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: pip install kittenml
        shell: bash
        run: |
          python -m pip install -q -U pip
          python -m pip install kittenml 2>&1 | tail -5
          echo "pip exit code: ${PIPESTATUS[0]}"
      - name: README usage
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("installed kittenml", version("kittenml"))
          try:
              from kittenml import KittenTTS
              print("RESULT ok: KittenTTS importable")
          except Exception as e:
              print(f"RESULT broken: {type(e).__name__}: {e}")
          PY
